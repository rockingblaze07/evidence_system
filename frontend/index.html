<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cybercrime Evidence Chain of Custody</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="blurry-shape"></div>

    <div class="app">
        <div id="navbar"></div>

        <main class="home-container">

            <div class="home-panel">

                <h2 data-i18n="home.welcome">
                    Welcome to Cybercrime Evidence Chain of Custody
                </h2>

                <p class="home-description" data-i18n="home.description">
                    Select your role from the navigation bar to proceed.
                </p>

                <p class="new-user">
                    <span data-i18n="home.newUser">
                        New user? Login or Signup below to continue.
                    </span>

                    <a href="login.html" class="green-link"
                       data-i18n="auth.login">
                        Login
                    </a>

                    or

                    <a href="signup.html" class="blue-link"
                       data-i18n="auth.signup">
                        Signup
                    </a>
                </p>

                <div class="language-selector">
                    <select id="languageSelect">
                        <option value="en">English</option>
                        <option value="hi">हिन्दी</option>
                        <option value="ta">தமிழ்</option>
                    </select>
                </div>

            </div>

        </main>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/common.js"></script>

</body>
</html>
