<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Police Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="blurry-shape"></div>

<div class="app">

    <div id="navbar"></div>

    <main class="dashboard-container">

        <div class="panel police-panel">

            <h2>🚔 <span data-i18n="police.title">
                Police Dashboard
            </span></h2>

            <form id="evidenceForm">

                <input
                    type="text"
                    id="officerName"
                    placeholder="Enter Officer Name"
                >

                <input
                    type="text"
                    id="designation"
                    placeholder="Enter Designation"
                >

                <input
                    type="file"
                    id="evidenceFile"
                    accept="*"
                >

                <div id="selectedFileName">
                    No file selected
                </div>

                <div class="button-group">

                    <button
                        type="button"
                        id="hashButton"
                        class="green-button">
                        Generate Hash
                    </button>

                    <button
                        type="submit"
                        class="blue-button">
                        Submit
                    </button>

                </div>

            </form>

            <div id="hashResult" class="result-box green-result hidden"></div>

            <div id="evidenceIdResult"
                 class="result-box yellow-result hidden">
            </div>

            <div id="backendResponse"
                 class="result-box blue-result hidden">

                <strong>Backend Response:</strong>

                <pre id="backendResponseText"></pre>

            </div>

        </div>

    </main>

</div>

<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/police.js"></script>

</body>
</html>
